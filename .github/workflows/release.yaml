name: release

# Publishes one base image per tag <base>/v<version>, e.g. debian-13/v1.0.0
# -> ghcr.io/sigeth/brokelabs-images/debian-13:1.0.0. The version must match the
# recipe's image.yaml (VM bases, vm/<base>) or the Dockerfile's
# org.opencontainers.image.version label (container bases, container/<base>).

on:
  push:
    tags: ["*/v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: |
          base="${GITHUB_REF_NAME%%/*}" version="${GITHUB_REF_NAME#*/v}"
          if [ -f "vm/$base/image.yaml" ]; then
            grep -qx "version: $version" "vm/$base/image.yaml" || { echo "vm/$base/image.yaml is not at version $version"; exit 1; }
            echo "build=vm-image --source=vm/$base" >> "$GITHUB_OUTPUT"
          elif [ -f "container/$base/Dockerfile" ]; then
            grep -q "org.opencontainers.image.version=\"$version\"" "container/$base/Dockerfile" || { echo "container/$base/Dockerfile is not at version $version"; exit 1; }
            echo "build=image --source=container/$base" >> "$GITHUB_OUTPUT"
          else
            echo "no base $base in vm/ or container/"; exit 1
          fi
          echo "address=ghcr.io/sigeth/brokelabs-images/$base:$version" >> "$GITHUB_OUTPUT"
      - uses: dagger/dagger-for-github@v8.4.1
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: "0.21.11"
          module: github.com/Sigeth/brokelabs-ci@v0.5.0
          verb: call
          args: >-
            ${{ steps.tag.outputs.build }}
            with-registry-auth --address=ghcr.io --username=${{ github.actor }} --secret=env://REGISTRY_TOKEN
            publish --address=${{ steps.tag.outputs.address }}
